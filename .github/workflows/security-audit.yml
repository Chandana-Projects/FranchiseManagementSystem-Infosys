name: Security & Code Guardrails Audit

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  security-audit:
    name: Backend CI & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          npm install --prefer-offline --no-audit

      - name: Generate Prisma Client
        working-directory: backend
        run: |
          npx prisma generate || true

      - name: Run Backend Unit & Security Tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-1234567890
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/franchise_db
        run: |
          npm test -- --forceExit

      - name: Dependency Security Audit
        working-directory: backend
        run: |
          npm audit --audit-level=critical || true
